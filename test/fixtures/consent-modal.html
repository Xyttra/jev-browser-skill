<!doctype html>
<title>Consent overlay</title>
<!-- A cookie banner whose overlay covers the middle of the page (it is in the way), with a decline
     option, like the Rijksmuseum's. -->
<style>body { font: 16px sans-serif; margin: 20px; } .cookie-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); } .cookie-bar { position: absolute; bottom: 0; left: 0; right: 0; background: #fff; padding: 20px; }</style>
<nav><a id="search" href="#search">Search</a></nav>
<aside class="cookie-overlay"><div class="cookie-bar"><p>This site uses cookies.</p><button id="accept">Accept</button> <button id="decline">No, rather not</button></div></aside>
